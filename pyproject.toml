[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtuber-shorts-agent"
version = "0.1.0"
description = "Modular pipeline for Japanese VTuber stream transcription and future Shorts discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VTuber Shorts Agent contributors"}]
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
vtuber-shorts = "vtuber_shorts_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
