[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtuber-shorts-agent"
version = "0.2.0"
description = "Japanese VTuber transcription and offline transcript-only Shorts event discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VTuber Shorts Agent contributors"}]
dependencies = [
    "faster-whisper",
    "av>=11,<19",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
vtuber-shorts = "vtuber_shorts_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vtuber_shorts_agent = ["resources/*.md", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
